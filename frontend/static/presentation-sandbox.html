<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-+Fvnb50ymnlB/gCxgAGDHBI+93u8LK9vKriOL2OiM/A=' blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"></head><body><main id="root"></main><script>
(function () {
  'use strict';
  const initial = null;
  let loaded = false;
  function report(type, message) {
    if (parent !== window) parent.postMessage({ type, message }, '*');
  }
  function start(presentation) {
    if (loaded) return;
    loaded = true;
    window.addEventListener('error', event => report('presentation-error', String(event.message)));
    window.addEventListener('unhandledrejection', event => report('presentation-error', String(event.reason)));

      if (value && typeof value === 'object') { Object.values(value).forEach(freeze); Object.freeze(value); }
      return value;
    };
    Object.defineProperty(window, 'LIATIR_RESULTS', { value: freeze(presentation.sources), writable: false, configurable: false });
    Object.defineProperty(window, 'LIATIR_PAGE', { value: freeze(presentation.page), writable: false, configurable: false });

    // Defaults for presentations without the Stage kit, in a layer so Tailwind's styles always win.
    style.textContent = '@layer sandbox{body{font:15px system-ui;margin:24px;color:#17212b;background:#fff}svg{max-width:100%}table{border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd}}' + (presentation.css || '');
    document.head.append(style);
    // A Stage page is a document its runtime draws; presentations made before pages carry their own code.
    const draw = presentation.page ? 'LiatirStage.showPage(LIATIR_PAGE, LIATIR_RESULTS);' : presentation.javascript;
    // Blob code is created inside the opaque frame. No file gateway or native bridge exists.
    const code = presentation.runtimeSource + '\n;try {\n' + draw + '\n;setTimeout(()=>{const root=document.getElementById("root");if(!root.children.length&&!root.textContent.trim())parent.postMessage({type:"presentation-error",message:"The presentation rendered no content."},"*");else parent.postMessage({type:"presentation-ready"},"*");},0);\n} catch(error) { parent.postMessage({type:"presentation-error",message:String(error)},"*"); }';
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    const script = document.createElement('script');
    script.src = url;
    script.onload = () => URL.revokeObjectURL(url);
    script.onerror = () => { URL.revokeObjectURL(url); report('presentation-error', 'Presentation code could not load.'); };
    document.body.append(script);
  }
  if (initial) start(initial);
  else {
    window.addEventListener('message', event => {
      if (event.source === parent && event.data?.type === 'presentation-render') start(event.data.presentation);
    });
    report('presentation-host-ready');
  }
})();
</script></body></html>
