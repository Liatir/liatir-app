# The Native Tools environment that ships inside Liatir.
#
# One manifest and one lock for every platform we bundle, so a tool cannot end up
# at a different version depending on which installer a user downloaded. The lock
# is the pin; the ranges below only record the lower bound the product needs and
# match `frontend/src/lib/data/dep-requirements.ts`.
#
# `win-64` is deliberately absent: bioconda does not build for Windows as a
# channel policy, and five of these six tools have no Windows build anywhere. The
# Windows installer ships the `linux-64` environment and runs it through WSL2.
# See project-knowledge-base/roadmap/native-tools-bundled-environment.md.

[workspace]
name = "liatir-native-tools"
version = "1.0.0"
description = "Bioinformatics command-line tools bundled with Liatir"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
samtools = ">=1.12"
bcftools = ">=1.12"
seqkit = ">=0.16.0"
fastp = ">=0.23.0"
bwa = ">=0.7.17"
minimap2 = ">=2.24"
