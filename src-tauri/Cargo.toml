[package]
name = "desktopr-wrapper"
version = "0.2.1"
edition = "2021"
default-run = "desktopr-wrapper"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "3.0.3", features = ["platform-windows"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.1"
objc = "0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
image = "0.25.9"

[dependencies]
tauri = { version = "2.11.1", features = ["rustls-tls", "tray-icon"] }

tauri-plugin-notification = { version = "2.3.3", optional = true }
tauri-plugin-autostart = { version = "2.5.1", optional = true }
tauri-plugin-global-shortcut = { version = "2.3.1", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-persisted-scope = { version = "2.3.7", optional = true }
tauri-plugin-clipboard-manager = { version = "2.3.2", optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-deep-link = { version = "2.4.7", optional = true }
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"], optional = true }
tauri-plugin-prevent-default = { version = "3.0.3", optional = true }
tauri-plugin-shell = "2.3.5"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
walkdir = "2.5.0"
bytes = "1.11.0"
url = "2.5.7"
getrandom = "0.3.4"
chrono = { version = "0.4.42", features = ["clock"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tokio = { version = "1.48.0", features = ["time", "rt"] }
reqwest = "0.12.24"

anyhow = "1.0.100"

# WASM runtime
wasmtime = "44.0.1"
wasmtime-wasi = { version = "44.0.1", features = ["p1"] }
cap-std = "4.0.2"

once_cell = "1.21.3"
rand = { version = "0.8.5", features = ["std", "std_rng"] }
toml = "0.9.8"

uuid = { version = "1.18.1", features = ["v4"] }

[features]
default = [
    "tauri-plugin-notification",
    "tauri-plugin-autostart",
    "tauri-plugin-global-shortcut",
    "tauri-plugin-updater",
    "tauri-plugin-persisted-scope",
    "tauri-plugin-clipboard-manager",
    "tauri-plugin-dialog",
    "tauri-plugin-deep-link",
    "tauri-plugin-single-instance",
    "tauri-plugin-prevent-default",
]

[profile.release]
opt-level = 2
lto = false
codegen-units = 8
strip = true

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[[bin]]
name = "desktopr-wrapper"
path = "src/main.rs"