name: Build the Native Tools Scrollcase box
description: >
  Builds, self-tests, signs and verifies the Native Tools box for one target into
  src-tauri/resources/native-tools/. On Linux it also builds the static WSL2
  consumer that Windows builds ship next to the Linux box. Expects Node and the
  root npm dependencies to be installed already.

inputs:
  target-id:
    description: "linux-x86_64-cpu or macos-aarch64-cpu"
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned pixi and conda-pack
      shell: bash
      env:
        PIXI_VERSION: v0.77.0
        PIXI_HOME: ${{ runner.temp }}/liatir-pixi
        PIXI_NO_PATH_UPDATE: '1'
      run: |
        curl -fsSL https://pixi.sh/install.sh | bash
        echo "$PIXI_HOME/bin" >> "$GITHUB_PATH"
        "$PIXI_HOME/bin/pixi" global install 'conda-pack==0.9.2'

    - name: Refuse a stale dependency lock
      shell: bash
      run: pixi lock --check --manifest-path runtime-boxes/scrolls/native-tools/${{ inputs.target-id }}/pixi.toml

    - uses: dtolnay/rust-toolchain@stable
      if: inputs.target-id == 'linux-x86_64-cpu'
      with:
        targets: x86_64-unknown-linux-musl

    - name: Build the statically linked WSL2 Scrollcase consumer
      if: inputs.target-id == 'linux-x86_64-cpu'
      shell: bash
      run: npm run native-tools:wsl-consumer:build

    - name: Build, self-test, sign and verify the Scrollcase box
      shell: bash
      run: npm run native-tools:build
