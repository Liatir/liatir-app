name: Runtime Box Windows CUDA preflight

on:
  workflow_dispatch:

# This paid GPU runner must only start through an explicit manual dispatch.
concurrency:
  group: runtime-box-windows-cuda-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Windows native T4 CUDA
    runs-on: liatir-windows-t4
    timeout-minutes: 60
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.runtime-box-ci/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime-box-ci/python

    steps:
      - name: Verify the Windows GPU host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $gpu = (& nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi failed on the Windows host: $gpu"
          }
          if ($gpu -notmatch 'T4') {
            throw "Expected an NVIDIA T4 GPU, but nvidia-smi reported: $gpu"
          }

          nvidia-smi
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi diagnostics failed with exit code $LASTEXITCODE."
          }

          @"
          ## Windows native CUDA

          - Runner: ``$env:RUNNER_NAME``
          - OS: ``$env:RUNNER_OS``
          - Architecture: ``$env:PROCESSOR_ARCHITECTURE``
          - GPU: ``$gpu``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Verify Runtime Box adapter and archive contracts
        run: npm run test:unit -- tests/unit/runtime-box-target-adapters.test.ts tests/unit/runtime-box-target-id-contract.test.ts

      - name: Build and verify the Windows stdlib fixture twice
        run: npm run runtime-box:test:native -- --recipe installer-fixture-windows-x86_64 --uv uv

      - name: Select Git Bash for composite actions
        shell: powershell
        run: |
          $gitBash = 'C:\Program Files\Git\bin'
          if (-not (Test-Path "$gitBash\bash.exe")) {
            throw "Git Bash is unavailable at $gitBash."
          }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Generate the embedded bridge bundle
        run: npm run ts:compile --prefix src-tauri

      - name: Create placeholder frontend output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value '<!doctype html><title>runtime box foundation</title>'

      - name: Verify Runtime Box Rust lifecycle on Windows
        working-directory: src-tauri
        run: cargo test runtime_box -- --nocapture

      - name: Clean Runtime Box foundation state
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue .runtime-box-build, .runtime-box-dist, .runtime-box-local, .runtime-box-ci
