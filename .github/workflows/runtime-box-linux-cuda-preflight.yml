name: Runtime Box Linux CUDA preflight

on:
  workflow_dispatch:

# This paid GPU runner must only start through an explicit manual dispatch.
concurrency:
  group: runtime-box-linux-cuda-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Cheap contracts before T4 allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run runtime-box:catalog:check

  preflight:
    name: Linux x64 T4 CUDA
    needs: guard
    runs-on: liatir-linux-cuda-selfhosted
    timeout-minutes: 15
    env:
      LIATIR_RUNTIME_BOX_HEARTBEAT_SECONDS: "300"

    steps:
      - name: Verify the Linux GPU host
        shell: bash
        run: |
          set -euo pipefail

          architecture="$(uname -m)"
          if [[ "$architecture" != "x86_64" ]]; then
            echo "Expected x86_64, but uname reported: $architecture" >&2
            exit 1
          fi

          gpu="$(nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader)"
          if [[ "$gpu" != *T4* ]]; then
            echo "Expected an NVIDIA T4 GPU, but nvidia-smi reported: $gpu" >&2
            exit 1
          fi

          nvidia-smi
          glibc="$(ldd --version 2>&1)"
          glibc="${glibc%%$'\n'*}"

          {
            echo "## Linux CUDA"
            echo
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- OS: \`$RUNNER_OS\`"
            echo "- Architecture: \`$architecture\`"
            echo "- GPU: \`$gpu\`"
            echo "- C library: \`$glibc\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pinned pixi and conda-pack
        shell: bash
        env:
          PIXI_VERSION: v0.73.0
          PIXI_HOME: ${{ runner.temp }}/liatir-pixi
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          "$PIXI_HOME/bin/pixi" global install "conda-pack==0.9.2"
          echo "$PIXI_HOME/bin" >> "$GITHUB_PATH"

      - name: Install Tauri Linux system dependencies
        run: bash scripts/install-runtime-box-linux-product-deps.sh

      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Generate the embedded bridge bundle
        run: npm run ts:compile --prefix src-tauri

      - name: Create placeholder frontend output
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>runtime box foundation</title>' > frontend/dist/index.html

      - name: Verify Runtime Box adapter and archive contracts
        run: npm run test:unit -- tests/unit/runtime-box-target-adapters.test.ts tests/unit/runtime-box-target-id-contract.test.ts

      - name: Build, consume, and verify the Linux v2 fixture twice
        run: >-
          node scripts/runtime-box/heartbeat.mjs
          --label "Linux T4 native fixture"
          -- npm run runtime-box:test:native -- --recipe installer-fixture-linux-x86_64

      - name: Clean Runtime Box foundation state
        if: always()
        shell: bash
        run: rm -rf .runtime-box-build .runtime-box-dist .runtime-box-local .runtime-box-ci
