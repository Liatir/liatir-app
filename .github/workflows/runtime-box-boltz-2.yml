name: Runtime Box Boltz-2

on:
  pull_request:
    paths:
      - "runtime-boxes/catalog.json"
      - "runtime-boxes/scrolls/boltz-2/linux-x86_64-cuda12.9/**"
      - "runtime-boxes/scrolls/boltz-2/*.py"
      - "runtime-boxes/legal/audits/boltz-2-linux-x86_64-cuda12.9.json"
      - "runtime-boxes/legal/audits/boltz-2-linux-x86_64-cuda12.9-pypi.json"
      - "runtime-boxes/legal/audits/boltz-2-linux-x86_64-cuda12.9-pypi-declaration.json"
      - "runtime-boxes/legal/boltz-2.md"
      - "runtime-boxes/fixtures/structures/1ubq.pdb"
      - "runtime-boxes/fixtures/proteins/P00918.fasta"
      - "scripts/validate-boltz-runtime.mjs"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/runtime-box/validator-context.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/ai/python-scripts/boltz-structure.ts"
      - "tests/e2e/specs/runtime-box-boltz-2-native.e2e.mjs"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-boltz-2.yml"
  push:
    branches: [main]
    paths:
      - "runtime-boxes/catalog.json"
      - "runtime-boxes/scrolls/boltz-2/linux-x86_64-cuda12.9/**"
      - "runtime-boxes/scrolls/boltz-2/*.py"
      - "runtime-boxes/legal/audits/boltz-2-linux-x86_64-cuda12.9.json"
      - "runtime-boxes/legal/audits/boltz-2-linux-x86_64-cuda12.9-pypi.json"
      - "runtime-boxes/legal/audits/boltz-2-linux-x86_64-cuda12.9-pypi-declaration.json"
      - "runtime-boxes/legal/boltz-2.md"
      - "runtime-boxes/fixtures/structures/1ubq.pdb"
      - "runtime-boxes/fixtures/proteins/P00918.fasta"
      - "scripts/validate-boltz-runtime.mjs"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/runtime-box/validator-context.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/ai/python-scripts/boltz-structure.ts"
      - "tests/e2e/specs/runtime-box-boltz-2-native.e2e.mjs"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-boltz-2.yml"
  workflow_dispatch:
    inputs:
      target_id:
        description: Checked Runtime Box target
        required: true
        type: choice
        options:
          - linux-x86_64-cuda12.9
      mode:
        description: Native validation depth
        required: true
        default: build
        type: choice
        options: [build, scientific, native-lifecycle]

concurrency:
  group: runtime-box-boltz-2-${{ inputs.target_id || 'linux-x86_64-cuda12.9' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_runtime-box-validate.yml
    with:
      model_id: jwohlwend-boltz-2
      target_id: ${{ inputs.target_id || 'linux-x86_64-cuda12.9' }}
      mode: ${{ inputs.mode || 'build' }}
      native_requested: ${{ github.event_name == 'workflow_dispatch' }}
