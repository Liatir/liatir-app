name: Runtime Box scGPT Whole-human

on:
  pull_request:
    paths:
      - "runtime-boxes/recipes/scgpt-whole-human-macos-arm64-metal/**"
      - "runtime-boxes/legal/scgpt-whole-human.md"
      - "scripts/validate-scgpt-runtime.mjs"
      - ".github/workflows/runtime-box-scgpt-whole-human.yml"
  push:
    branches: [main]
    paths:
      - "runtime-boxes/recipes/scgpt-whole-human-macos-arm64-metal/**"
      - "runtime-boxes/legal/scgpt-whole-human.md"
      - "scripts/validate-scgpt-runtime.mjs"
      - ".github/workflows/runtime-box-scgpt-whole-human.yml"
  workflow_dispatch:
    inputs:
      target_id:
        description: Checked Runtime Box target
        required: true
        type: choice
        options: [macos-aarch64-metal]
      mode:
        description: Native validation depth
        required: true
        default: build
        type: choice
        options: [build, scientific, native-lifecycle]

concurrency:
  group: runtime-box-scgpt-whole-human-${{ inputs.target_id || 'macos-aarch64-metal' }}-${{ inputs.mode || 'build' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_runtime-box-validate.yml
    with:
      model_id: bowang-scgpt-whole-human
      recipe_id: scgpt-whole-human-macos-arm64-metal
      target_id: ${{ inputs.target_id || 'macos-aarch64-metal' }}
      mode: ${{ inputs.mode || 'build' }}
      native_requested: ${{ github.event_name == 'workflow_dispatch' }}
