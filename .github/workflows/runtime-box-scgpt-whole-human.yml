name: Runtime Box scGPT Whole-human

on:
  pull_request:
    paths:
      - "runtime-boxes/scrolls/scgpt-whole-human/macos-aarch64-metal/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-macos-arm64-metal.json"
      - "runtime-boxes/scrolls/scgpt-whole-human/linux-x86_64-cpu/**"
      - "runtime-boxes/scrolls/scgpt-whole-human/linux-x86_64-cuda12.9/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-linux-x86_64-cuda12.9.json"
      - "runtime-boxes/scrolls/scgpt-whole-human/windows-x86_64-cpu/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-linux-x86_64-cpu.json"
      - "runtime-boxes/legal/audits/scgpt-whole-human-windows-x86_64-cpu.json"
      - "runtime-boxes/scrolls/scgpt-whole-human/windows-x86_64-cuda12.8/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-windows-x86_64-cuda12.8.json"
      - "runtime-boxes/legal/scgpt-whole-human.md"
      - "scripts/validate-scgpt-runtime.mjs"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/runtime-box/validator-context.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/ai/python-scripts/scgpt-embedding.ts"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-scgpt-whole-human.yml"
  push:
    branches: [main]
    paths:
      - "runtime-boxes/scrolls/scgpt-whole-human/macos-aarch64-metal/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-macos-arm64-metal.json"
      - "runtime-boxes/scrolls/scgpt-whole-human/linux-x86_64-cpu/**"
      - "runtime-boxes/scrolls/scgpt-whole-human/linux-x86_64-cuda12.9/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-linux-x86_64-cuda12.9.json"
      - "runtime-boxes/scrolls/scgpt-whole-human/windows-x86_64-cpu/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-linux-x86_64-cpu.json"
      - "runtime-boxes/legal/audits/scgpt-whole-human-windows-x86_64-cpu.json"
      - "runtime-boxes/scrolls/scgpt-whole-human/windows-x86_64-cuda12.8/**"
      - "runtime-boxes/legal/audits/scgpt-whole-human-windows-x86_64-cuda12.8.json"
      - "runtime-boxes/legal/scgpt-whole-human.md"
      - "scripts/validate-scgpt-runtime.mjs"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/runtime-box/validator-context.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/ai/python-scripts/scgpt-embedding.ts"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-scgpt-whole-human.yml"
  workflow_dispatch:
    inputs:
      target_id:
        description: Checked Runtime Box target
        required: true
        type: choice
        options: [macos-aarch64-metal, linux-x86_64-cpu, linux-x86_64-cuda12.9, windows-x86_64-cpu, windows-x86_64-cuda12.8]
      mode:
        description: Native validation depth
        required: true
        default: build
        type: choice
        options: [build, scientific, native-lifecycle]

concurrency:
  group: runtime-box-scgpt-whole-human-${{ inputs.target_id || 'macos-aarch64-metal' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_runtime-box-validate.yml
    with:
      model_id: bowang-scgpt-whole-human
      target_id: ${{ inputs.target_id || 'macos-aarch64-metal' }}
      mode: ${{ inputs.mode || 'build' }}
      native_requested: ${{ github.event_name == 'workflow_dispatch' }}
