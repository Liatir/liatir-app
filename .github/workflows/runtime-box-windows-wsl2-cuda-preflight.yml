name: Runtime Box Windows WSL2 CUDA preflight

on:
  workflow_dispatch:

# This paid GPU runner must only start through an explicit manual dispatch.
concurrency:
  group: runtime-box-windows-wsl2-cuda-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Windows T4 and WSL2 CUDA
    runs-on: liatir-windows-t4
    timeout-minutes: 15

    steps:
      - name: Verify the Windows GPU host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $gpu = (& nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi failed on the Windows host: $gpu"
          }
          if ($gpu -notmatch 'T4') {
            throw "Expected an NVIDIA T4 GPU, but nvidia-smi reported: $gpu"
          }

          nvidia-smi
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi diagnostics failed with exit code $LASTEXITCODE."
          }

          @"
          ## Windows GPU host

          - Runner: ``$env:RUNNER_NAME``
          - OS: ``$env:RUNNER_OS``
          - GPU: ``$gpu``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Verify WSL2 CUDA passthrough
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
            throw 'wsl.exe is not installed on this Windows GPU image.'
          }

          $wslVersion = ((& wsl.exe --version 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            $wslVersion = 'Unavailable on the inbox WSL CLI shipped with this Windows image.'
          }
          $wslStatus = ((& wsl.exe --status 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            $wslStatus = "Command exited with code $LASTEXITCODE.`n$wslStatus"
          }
          $wslDistros = ((& wsl.exe --list --verbose 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            if ($wslDistros -match 'no installed distributions') {
              throw 'WSL is present, but this runner image has no installed Linux distribution.'
            }
            throw "wsl.exe --list --verbose failed: $wslDistros"
          }

          $distros = @(
            & wsl.exe --list --quiet |
              ForEach-Object { ($_ -replace "`0", '').Trim() } |
              Where-Object { $_ }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "wsl.exe --list --quiet failed with exit code $LASTEXITCODE."
          }
          if ($distros.Count -eq 0) {
            throw 'WSL is present, but this runner image has no installed Linux distribution.'
          }

          $distro = $distros[0]
          $kernel = (& wsl.exe --distribution $distro --exec sh -lc 'uname -r') -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the $distro WSL kernel: $kernel"
          }
          if ($kernel -notmatch 'WSL2') {
            throw "Expected WSL2, but $distro reported kernel: $kernel"
          }

          $wslGpu = (& wsl.exe --distribution $distro --exec sh -lc 'nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader') -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi failed inside ${distro}: $wslGpu"
          }
          if ($wslGpu -notmatch 'T4') {
            throw "Expected CUDA passthrough for an NVIDIA T4, but WSL reported: $wslGpu"
          }

          @"
          ## WSL2 CUDA passthrough

          - Distribution: ``$distro``
          - Kernel: ``$kernel``
          - GPU: ``$wslGpu``

          <details>
          <summary>WSL diagnostics</summary>

          ``````text
          $wslVersion

          $wslStatus

          $wslDistros
          ``````
          </details>
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
