name: Runtime Box Windows WSL2 CUDA preflight

on:
  workflow_dispatch:

# This paid GPU runner must only start through an explicit manual dispatch.
concurrency:
  group: runtime-box-windows-wsl2-cuda-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Windows T4 and WSL2 CUDA
    runs-on: liatir-windows-t4
    timeout-minutes: 15
    env:
      WSL_DISTRO_NAME: LiatirUbuntu2204
      WSL_KERNEL_MSI_URL: https://wslstorestorage.blob.core.windows.net/wslblob/wsl_update_x64.msi
      WSL_ROOTFS_URL: https://cloud-images.ubuntu.com/wsl/jammy/20250318/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz
      WSL_ROOTFS_SHA256: 1483cc5c1dce13064f774834cbffdff226559fd522a67a381a8ea77d63fb4109

    steps:
      - name: Verify the Windows GPU host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $gpu = (& nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi failed on the Windows host: $gpu"
          }
          if ($gpu -notmatch 'T4') {
            throw "Expected an NVIDIA T4 GPU, but nvidia-smi reported: $gpu"
          }

          nvidia-smi
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi diagnostics failed with exit code $LASTEXITCODE."
          }

          @"
          ## Windows GPU host

          - Runner: ``$env:RUNNER_NAME``
          - OS: ``$env:RUNNER_OS``
          - GPU: ``$gpu``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Import the pinned Ubuntu WSL2 distribution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
            throw 'wsl.exe is not installed on this Windows GPU image.'
          }

          $kernelMsi = Join-Path $env:RUNNER_TEMP 'wsl_update_x64.msi'
          $rootfs = Join-Path $env:RUNNER_TEMP 'ubuntu-22.04-wsl-amd64.rootfs.tar.gz'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'liatir-ubuntu-22.04'

          curl.exe --fail --location --retry 3 --output $kernelMsi $env:WSL_KERNEL_MSI_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft WSL2 kernel download failed with exit code $LASTEXITCODE."
          }

          $kernelSignature = Get-AuthenticodeSignature -FilePath $kernelMsi
          if ($kernelSignature.Status -ne 'Valid' -or $kernelSignature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "Microsoft WSL2 kernel signature validation failed: $($kernelSignature.Status), $($kernelSignature.StatusMessage)"
          }

          $kernelInstall = Start-Process msiexec.exe -ArgumentList @('/i', $kernelMsi, '/quiet', '/norestart') -Wait -PassThru
          if ($kernelInstall.ExitCode -ne 0) {
            throw "Microsoft WSL2 kernel installation failed with exit code $($kernelInstall.ExitCode)."
          }

          curl.exe --fail --location --retry 3 --output $rootfs $env:WSL_ROOTFS_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical WSL rootfs download failed with exit code $LASTEXITCODE."
          }

          $actualSha256 = (Get-FileHash -Path $rootfs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:WSL_ROOTFS_SHA256) {
            throw "Canonical WSL rootfs checksum mismatch: expected $env:WSL_ROOTFS_SHA256, received $actualSha256."
          }

          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          $importOutput = ((& wsl.exe --import $env:WSL_DISTRO_NAME $installDirectory $rootfs --version 2 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            throw "WSL2 distribution import failed: $importOutput"
          }

          @"
          ## Pinned WSL distribution

          - Distribution: ``$env:WSL_DISTRO_NAME``
          - Rootfs SHA-256: ``$actualSha256``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Verify WSL2 CUDA passthrough
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
            throw 'wsl.exe is not installed on this Windows GPU image.'
          }

          $wslVersion = ((& wsl.exe --version 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            $wslVersion = 'Unavailable on the inbox WSL CLI shipped with this Windows image.'
          }
          $wslStatus = ((& wsl.exe --status 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            $wslStatus = "Command exited with code $LASTEXITCODE.`n$wslStatus"
          }
          $wslDistros = ((& wsl.exe --list --verbose 2>&1) -join "`n") -replace "`0", ''
          if ($LASTEXITCODE -ne 0) {
            if ($wslDistros -match 'no installed distributions') {
              throw 'WSL is present, but this runner image has no installed Linux distribution.'
            }
            throw "wsl.exe --list --verbose failed: $wslDistros"
          }

          $distros = @(& wsl.exe --list --quiet | ForEach-Object { ($_ -replace "`0", '').Trim() } | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) {
            throw "wsl.exe --list --quiet failed with exit code $LASTEXITCODE."
          }
          if ($distros -notcontains $env:WSL_DISTRO_NAME) {
            throw "Expected WSL distribution $env:WSL_DISTRO_NAME, but found: $($distros -join ', ')"
          }

          $distro = $env:WSL_DISTRO_NAME
          $kernel = (& wsl.exe --distribution $distro --exec sh -lc 'uname -r') -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the $distro WSL kernel: $kernel"
          }
          if ($kernel -notmatch 'WSL2') {
            throw "Expected WSL2, but $distro reported kernel: $kernel"
          }

          $wslGpu = (& wsl.exe --distribution $distro --exec sh -lc '/usr/lib/wsl/lib/nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader') -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi failed inside ${distro}: $wslGpu"
          }
          if ($wslGpu -notmatch 'T4') {
            throw "Expected CUDA passthrough for an NVIDIA T4, but WSL reported: $wslGpu"
          }

          @"
          ## WSL2 CUDA passthrough

          - Distribution: ``$distro``
          - Kernel: ``$kernel``
          - GPU: ``$wslGpu``

          <details>
          <summary>WSL diagnostics</summary>

          ``````text
          $wslVersion

          $wslStatus

          $wslDistros
          ``````
          </details>
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
