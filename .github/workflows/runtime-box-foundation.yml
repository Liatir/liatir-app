name: Runtime Box foundation

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: One foundation fixture to validate natively
        required: true
        type: choice
        options:
          - installer-fixture-linux-x86_64
          - installer-fixture-windows-x86_64

concurrency:
  group: runtime-box-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-fixtures:
    name: Native fixture (${{ inputs.fixture_id }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.fixture_id == 'installer-fixture-linux-x86_64' && 'liatir-linux-selfhosted' || 'liatir-windows-selfhosted' }}
    timeout-minutes: ${{ inputs.fixture_id == 'installer-fixture-linux-x86_64' && 30 || 60 }}
    env:
      LIATIR_RUNTIME_BOX_HEARTBEAT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify catalog and shared contracts
        run: |
          npm run runtime-box:catalog:check
          npm run test:unit -- tests/unit/runtime-box-ci-catalog.test.ts tests/unit/runtime-box-target-adapters.test.ts tests/unit/runtime-box-target-id-contract.test.ts tests/unit/runtime-box-publisher.test.ts
          npm run runtime-box:signer:check

      - name: Verify TAR safety and deterministic Zip64 extraction
        run: npm run runtime-box:test:foundation

      - name: Install pinned pixi and conda-pack (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PIXI_VERSION: v0.73.0
          PIXI_HOME: ${{ runner.temp }}/liatir-pixi
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          "$PIXI_HOME/bin/pixi" global install "conda-pack==0.9.2"
          echo "$PIXI_HOME/bin" >> "$GITHUB_PATH"

      - name: Install pinned pixi and conda-pack (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PIXI_VERSION: v0.73.0
          PIXI_HOME: ${{ runner.temp }}\liatir-pixi
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -UseBasicParsing https://pixi.sh/install.ps1 | Invoke-Expression
          & "$env:PIXI_HOME\bin\pixi.exe" global install "conda-pack==0.9.2"
          "$env:PIXI_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify native fixture host and working storage
        run: >-
          npm run runtime-box:ci -- foundation-host-probe
          --recipe "${{ inputs.fixture_id }}"
          --output ".runtime-box-ci/${{ inputs.fixture_id }}-host.json"

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-runtime-box-linux-product-deps.sh

      - name: Select Git Bash for composite actions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitBash = 'C:\Program Files\Git\bin'
          if (-not (Test-Path "$gitBash\bash.exe")) { throw "Git Bash is unavailable at $gitBash." }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Generate the embedded bridge bundle
        run: npm run ts:compile --prefix src-tauri

      - name: Create placeholder frontend output
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>runtime box foundation</title>' > frontend/dist/index.html

      - name: Build, consume, and verify the native v2 fixture twice
        run: >-
          node scripts/runtime-box/heartbeat.mjs
          --label "Native v2 fixture ${{ inputs.fixture_id }}"
          -- npm run runtime-box:test:native --
          --recipe "${{ inputs.fixture_id }}"
          --output ".runtime-box-ci/${{ inputs.fixture_id }}-native-result.json"

      - name: Write native fixture evidence
        if: always()
        run: npm run runtime-box:ci -- write-evidence --phase foundation-native --status "${{ job.status }}" --recipe "${{ inputs.fixture_id }}" --output ".runtime-box-ci/${{ inputs.fixture_id }}.json"

      - name: Upload native fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-box-foundation-${{ inputs.fixture_id }}-${{ github.run_attempt }}
          path: |
            .runtime-box-ci/${{ inputs.fixture_id }}.json
            .runtime-box-ci/${{ inputs.fixture_id }}-host.json
            .runtime-box-ci/${{ inputs.fixture_id }}-native-result.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Clean Runtime Box CI state
        if: always()
        run: npm run runtime-box:ci -- clean
