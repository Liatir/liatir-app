name: Runtime Box foundation

on:
  pull_request:
    paths:
      - "packages/liatir-core/src/runtime-box.ts"
      - "packages/liatir-core/src/ai-catalog.ts"
      - "scripts/runtime-box.mjs"
      - "scripts/runtime-box/**"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/validate-runtime-box-foundation.mjs"
      - "scripts/validate-runtime-box-native-fixture.mjs"
      - "runtime-boxes/catalog.json"
      - "runtime-boxes/evidence/**"
      - "runtime-boxes/target-id-contract.json"
      - "runtime-boxes/trust/**"
      - "runtime-boxes/recipes/installer-fixture-*/**"
      - "services/runtime-box-signer/**"
      - "workers/runtime-box-registry/**"
      - "src-tauri/src/bridge/runtime_boxes.rs"
      - "tests/unit/runtime-box-*.test.ts"
      - ".github/workflows/runtime-box-*.yml"
      - ".github/workflows/_runtime-box-validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/liatir-core/src/runtime-box.ts"
      - "packages/liatir-core/src/ai-catalog.ts"
      - "scripts/runtime-box.mjs"
      - "scripts/runtime-box/**"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/validate-runtime-box-foundation.mjs"
      - "scripts/validate-runtime-box-native-fixture.mjs"
      - "runtime-boxes/catalog.json"
      - "runtime-boxes/evidence/**"
      - "runtime-boxes/target-id-contract.json"
      - "runtime-boxes/trust/**"
      - "runtime-boxes/recipes/installer-fixture-*/**"
      - "services/runtime-box-signer/**"
      - "workers/runtime-box-registry/**"
      - "src-tauri/src/bridge/runtime_boxes.rs"
      - "tests/unit/runtime-box-*.test.ts"
      - ".github/workflows/runtime-box-*.yml"
      - ".github/workflows/_runtime-box-validate.yml"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: runtime-box-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Shared contracts and archive foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Tauri Linux system dependencies
        run: bash scripts/install-runtime-box-linux-product-deps.sh

      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Generate the embedded bridge bundle
        run: npm run ts:compile --prefix src-tauri

      - name: Create placeholder frontend output
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>runtime box foundation</title>' > frontend/dist/index.html

      - name: Verify catalog and shared contracts
        run: |
          npm run runtime-box:catalog:check
          npm run test:unit -- tests/unit/runtime-box-ci-catalog.test.ts tests/unit/runtime-box-target-adapters.test.ts tests/unit/runtime-box-target-id-contract.test.ts tests/unit/runtime-box-publisher.test.ts
          npm run runtime-box:signer:check

      - name: Verify TAR safety and deterministic Zip64 extraction
        run: npm run runtime-box:test:foundation

      - id: matrix
        name: Resolve the native fixture matrix
        run: npm run runtime-box:ci -- foundation-matrix

      - name: Write preflight evidence
        if: always()
        run: npm run runtime-box:ci -- write-evidence --phase foundation-preflight --status "${{ job.status }}" --output .runtime-box-ci/foundation-preflight.json

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-box-foundation-preflight-${{ github.run_attempt }}
          path: .runtime-box-ci/foundation-preflight.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  native-fixtures:
    name: Native fixture (${{ matrix.recipeId }})
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    env:
      LIATIR_RUNTIME_BOX_HEARTBEAT_SECONDS: ${{ matrix.heartbeatSeconds }}
      UV_CACHE_DIR: ${{ github.workspace }}/.runtime-box-ci/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime-box-ci/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Verify native fixture host and working storage
        run: >-
          npm run runtime-box:ci -- foundation-host-probe
          --recipe "${{ matrix.recipeId }}"
          --output ".runtime-box-ci/${{ matrix.recipeId }}-host.json"

      - name: Build and verify the native stdlib fixture twice
        run: >-
          node scripts/runtime-box/heartbeat.mjs
          --label "Native fixture ${{ matrix.recipeId }}"
          -- npm run runtime-box:test:native -- --recipe "${{ matrix.recipeId }}" --uv uv

      - name: Select Git Bash for composite actions
        if: matrix.rustLifecycle && runner.os == 'Windows'
        shell: powershell
        run: |
          $gitBash = 'C:\Program Files\Git\bin'
          if (-not (Test-Path "$gitBash\bash.exe")) { throw "Git Bash is unavailable at $gitBash." }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned Rust 1.95.0
        if: matrix.rustLifecycle
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Generate the embedded bridge bundle
        if: matrix.rustLifecycle
        run: npm run ts:compile --prefix src-tauri

      - name: Create placeholder frontend output
        if: matrix.rustLifecycle
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>runtime box foundation</title>' > frontend/dist/index.html

      - name: Verify the Rust lifecycle
        if: matrix.rustLifecycle
        run: >-
          node scripts/runtime-box/heartbeat.mjs
          --label "Rust lifecycle ${{ matrix.recipeId }}"
          --cwd src-tauri
          -- cargo test runtime_box -- --nocapture

      - name: Write native fixture evidence
        if: always()
        run: npm run runtime-box:ci -- write-evidence --phase foundation-native --status "${{ job.status }}" --recipe "${{ matrix.recipeId }}" --output ".runtime-box-ci/${{ matrix.recipeId }}.json"

      - name: Upload native fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-box-foundation-${{ matrix.recipeId }}-${{ github.run_attempt }}
          path: .runtime-box-ci/${{ matrix.recipeId }}.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Clean Runtime Box CI state
        if: always()
        run: npm run runtime-box:ci -- clean
