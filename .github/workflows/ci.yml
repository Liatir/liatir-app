name: CI

on:
  # Direct pushes are intentionally batched into one weekly run to avoid
  # spending macOS runner minutes on every small stabilization commit.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.mind/**'

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript / frontend / unit + contract tests ────────────────────────
  quality:
    name: Quality (TS, unit, svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only install where a package-lock.json is committed. liatir-core and
      # liatir-output-parser are private, type-only packages with no lockfile —
      # they build with the root-resolved tsc, so `npm ci` must NOT target them.
      - run: npm ci
      - run: npm ci --prefix packages/liatir-cli
      - run: npm ci --prefix packages/liatir-api
      - run: npm ci --prefix frontend

      # unit → sdk-types → core-build → frontend-check → frontend-build → src-ts-compile
      # (This is the project's own `verify` profile — the real quality gate.)
      - name: Verify profile (unit + types + builds)
        run: npm run test:verify

  # ── ESLint on the shippable TS packages (ADVISORY — never blocks a merge) ──
  # Type-aware lint of the SDK/CLI/API/core. Kept non-blocking while the
  # baseline is cleaned up: findings are visible (job goes red on its own line
  # + inline annotations) but do not gate the merge. Promote to `required` in
  # branch protection once the baseline is at zero.
  lint-ts:
    name: ESLint TS packages (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only lockfile-backed packages are installed with `npm ci`. liatir-core
      # has no lock (type-only), so it is BUILT via the root tsc to produce the
      # @liatir/core types that the cli/api sources import — accurate type-aware
      # linting without an install.
      - run: npm ci
      - run: npm ci --prefix packages/liatir-cli
      - run: npm ci --prefix packages/liatir-api
      - run: npm run build --prefix packages/liatir-core
      # Register the ESLint problem matcher so findings show as inline
      # error/warning annotations on the PR (not just buried in the log).
      - name: ESLint
        run: |
          echo "::add-matcher::.github/eslint-matcher.json"
          npm run lint:ts

  # ── Rust bridge: cargo test (blocking) + clippy (advisory) ───────────────
  # Runs on macOS — the primary development/build target — so the crate
  # compiles exactly as it does locally (no Linux webkit cross-compile risk).
  rust:
    name: Rust (tests + clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The crate embeds a generated bundle at compile time
      # (`include_str!("../tsc/bridge.js")`). It is gitignored, so build it
      # with esbuild before cargo — otherwise compilation fails.
      - name: Generate bridge bundle
        run: npm run ts:compile --prefix src-tauri

      # `tauri::generate_context!` reads tauri.conf.json and expects the
      # frontendDist dir to exist. A placeholder is enough for tests/clippy —
      # they do not need real frontend assets.
      - name: Placeholder frontend dist
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci</title>' > frontend/dist/index.html

      # Real gate: the crate must compile and its tests must pass.
      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # Advisory: clippy findings are visible but do not block a merge while the
      # existing baseline is cleaned up. Promote to blocking once it is clean.
      - name: Clippy (advisory)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets
