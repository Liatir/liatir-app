name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript / frontend / unit + contract tests ────────────────────────
  quality:
    name: Quality (TS, unit, svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install deps for every workspace the verify profile touches. Packages
      # are not npm workspaces, so each is installed at its own prefix.
      - run: npm ci
      - run: npm ci --prefix packages/liatir-core
      - run: npm ci --prefix packages/liatir-cli
      - run: npm ci --prefix packages/liatir-api
      - run: npm ci --prefix frontend

      # Prettier formatting gate (the frontend `lint` script).
      - name: Prettier check
        run: npm run lint --prefix frontend

      # unit → sdk-types → core-build → frontend-check → frontend-build → src-ts-compile
      - name: Verify profile (unit + types + builds)
        run: npm run test:verify

  # ── ESLint on the shippable TS packages (ADVISORY — never blocks a merge) ──
  # Type-aware lint of the SDK/CLI/API/core. Kept non-blocking while the
  # baseline is cleaned up: findings are visible (job goes red on its own line
  # + inline annotations) but do not gate the merge. Promote to `required` in
  # branch protection once the baseline is at zero.
  lint-ts:
    name: ESLint TS packages (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/liatir-core
      - run: npm ci --prefix packages/liatir-cli
      - run: npm ci --prefix packages/liatir-api
      # Register the ESLint problem matcher so findings show as inline
      # error/warning annotations on the PR (not just buried in the log).
      - name: ESLint
        run: |
          echo "::add-matcher::.github/eslint-matcher.json"
          npm run lint:ts

  # ── Rust bridge: clippy (correctness/suspicious denied) + tests ──────────
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux system dependencies (needed to compile the crate).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` reads tauri.conf.json and expects the
      # frontendDist dir to exist. A placeholder is enough for clippy/tests —
      # they do not need real frontend assets.
      - name: Placeholder frontend dist
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci</title>' > frontend/dist/index.html

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Tests
        working-directory: src-tauri
        run: cargo test
