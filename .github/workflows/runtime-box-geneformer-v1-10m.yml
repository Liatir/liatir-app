name: Runtime Box Geneformer V1 10M

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/runtime-box.mjs"
      - "scripts/runtime-box/**"
      - "runtime-boxes/recipes/geneformer-v1-10m-macos-arm64-metal/**"
      - "runtime-boxes/recipes/geneformer-v1-10m-linux-x86_64-cpu/**"
      - "runtime-boxes/recipes/geneformer-v1-10m-windows-x86_64-cpu/**"
      - "runtime-boxes/legal/audits/geneformer-v1-10m-windows-x86_64-cpu.json"
      - "runtime-boxes/legal/geneformer-v1-10m.md"
      - "scripts/validate-geneformer-parity.mjs"
      - "scripts/ai-validation/geneformer-parity.py"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/ai/python-scripts/geneformer-embedding.ts"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-geneformer-v1-10m.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/runtime-box.mjs"
      - "scripts/runtime-box/**"
      - "runtime-boxes/recipes/geneformer-v1-10m-macos-arm64-metal/**"
      - "runtime-boxes/recipes/geneformer-v1-10m-linux-x86_64-cpu/**"
      - "runtime-boxes/recipes/geneformer-v1-10m-windows-x86_64-cpu/**"
      - "runtime-boxes/legal/audits/geneformer-v1-10m-windows-x86_64-cpu.json"
      - "runtime-boxes/legal/geneformer-v1-10m.md"
      - "scripts/validate-geneformer-parity.mjs"
      - "scripts/ai-validation/geneformer-parity.py"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/ai/python-scripts/geneformer-embedding.ts"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-geneformer-v1-10m.yml"
  workflow_dispatch:
    inputs:
      target_id:
        description: Checked Runtime Box target
        required: true
        type: choice
        options: [macos-aarch64-metal, linux-x86_64-cpu, windows-x86_64-cpu]
      mode:
        description: Native validation depth
        required: true
        default: build
        type: choice
        options: [build, scientific, native-lifecycle]

concurrency:
  group: runtime-box-geneformer-v1-10m-${{ inputs.target_id || 'macos-aarch64-metal' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_runtime-box-validate.yml
    with:
      model_id: ctheodoris-geneformer-v1-10m
      target_id: ${{ inputs.target_id || 'macos-aarch64-metal' }}
      mode: ${{ inputs.mode || 'build' }}
      native_requested: ${{ github.event_name == 'workflow_dispatch' }}
