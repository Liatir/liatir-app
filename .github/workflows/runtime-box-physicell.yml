name: Runtime Box PhysiCell

on:
  pull_request:
    paths:
      - "runtime-boxes/catalog.json"
      - "runtime-boxes/scrolls/physicell/linux-x86_64-cpu/**"
      - "runtime-boxes/scrolls/physicell/self-test.py"
      - "runtime-boxes/legal/audits/physicell-linux-x86_64-cpu.json"
      - "runtime-boxes/legal/audits/physicell-linux-x86_64-cpu-bundled-declaration.json"
      - "runtime-boxes/legal/physicell.md"
      - "runtime-boxes/fixtures/physicell/fixtures.py"
      - "scripts/validate-physicell-runtime.mjs"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box/measure-python.py"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/runtime-box/validator-context.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/physicell/python-scripts/physicell.ts"
      - "tests/e2e/specs/runtime-box-physicell-native.e2e.mjs"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-physicell.yml"
  push:
    branches: [main]
    paths:
      - "runtime-boxes/catalog.json"
      - "runtime-boxes/scrolls/physicell/linux-x86_64-cpu/**"
      - "runtime-boxes/scrolls/physicell/self-test.py"
      - "runtime-boxes/legal/audits/physicell-linux-x86_64-cpu.json"
      - "runtime-boxes/legal/audits/physicell-linux-x86_64-cpu-bundled-declaration.json"
      - "runtime-boxes/legal/physicell.md"
      - "runtime-boxes/fixtures/physicell/fixtures.py"
      - "scripts/validate-physicell-runtime.mjs"
      - "scripts/runtime-box/evidence.mjs"
      - "scripts/runtime-box/measure-python.py"
      - "scripts/runtime-box-ci.mjs"
      - "scripts/runtime-box/validator-context.mjs"
      - "scripts/install-runtime-box-linux-product-deps.sh"
      - "frontend/src/lib/tools/physicell/python-scripts/physicell.ts"
      - "tests/e2e/specs/runtime-box-physicell-native.e2e.mjs"
      - ".github/workflows/_runtime-box-validate.yml"
      - ".github/workflows/runtime-box-physicell.yml"
  workflow_dispatch:
    inputs:
      target_id:
        description: Checked Runtime Box target
        required: true
        type: choice
        options:
          - linux-x86_64-cpu
      mode:
        description: Native validation depth
        required: true
        default: build
        type: choice
        options: [build, scientific, native-lifecycle]

concurrency:
  group: runtime-box-physicell-${{ inputs.target_id || 'linux-x86_64-cpu' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_runtime-box-validate.yml
    with:
      model_id: physicell-multicellular-simulation
      target_id: ${{ inputs.target_id || 'linux-x86_64-cpu' }}
      mode: ${{ inputs.mode || 'build' }}
      native_requested: ${{ github.event_name == 'workflow_dispatch' }}
