name: Runtime Box reusable validation

on:
  workflow_call:
    inputs:
      model_id:
        required: true
        type: string
      target_id:
        required: true
        type: string
      mode:
        required: true
        type: string
      native_requested:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Checked catalog preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      recipe_id: ${{ steps.resolve.outputs.recipe_id }}
      runs_on: ${{ steps.resolve.outputs.runs_on }}
      timeout_minutes: ${{ steps.resolve.outputs.timeout_minutes }}
      uv_version: ${{ steps.resolve.outputs.uv_version }}
      validator_script: ${{ steps.resolve.outputs.validator_script }}
      native_eligible: ${{ steps.resolve.outputs.native_eligible }}
      gpu_required: ${{ steps.resolve.outputs.gpu_required }}
      release_path: ${{ steps.resolve.outputs.release_path }}
      heartbeat_seconds: ${{ steps.resolve.outputs.heartbeat_seconds }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: resolve
        name: Validate legal, recipe, target, runner, timeout, and mode
        run: >-
          npm run runtime-box:ci -- resolve
          --model "${{ inputs.model_id }}"
          --target "${{ inputs.target_id }}"
          --mode "${{ inputs.mode }}"
          --native-requested "${{ inputs.native_requested }}"

      - name: Verify focused catalog contracts
        run: npm run test:unit -- tests/unit/runtime-box-ci-catalog.test.ts tests/unit/runtime-box-target-id-contract.test.ts

      - name: Write compact preflight evidence
        if: always()
        run: >-
          npm run runtime-box:ci -- write-evidence
          --phase foundation-preflight
          --status "${{ job.status }}"
          --model "${{ inputs.model_id }}"
          --recipe "${{ steps.resolve.outputs.recipe_id }}"
          --target "${{ inputs.target_id }}"
          --mode "${{ inputs.mode }}"
          --output .runtime-box-ci/model-preflight.json

      - name: Upload compact preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-box-preflight-${{ inputs.model_id }}-${{ inputs.target_id }}-${{ github.run_attempt }}
          path: .runtime-box-ci/model-preflight.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  native:
    name: Native ${{ inputs.mode }} validation
    needs: preflight
    if: needs.preflight.outputs.native_eligible == 'true'
    runs-on: ${{ needs.preflight.outputs.runs_on }}
    timeout-minutes: ${{ fromJSON(needs.preflight.outputs.timeout_minutes) }}
    env:
      LIATIR_RUNTIME_BOX_HEARTBEAT_SECONDS: ${{ needs.preflight.outputs.heartbeat_seconds }}
      UV_CACHE_DIR: ${{ github.workspace }}/.runtime-box-ci/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime-box-ci/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ needs.preflight.outputs.uv_version }}
          enable-cache: false

      - name: Verify native host, GPU requirement, and working storage
        run: >-
          npm run runtime-box:ci -- host-probe
          --model "${{ inputs.model_id }}"
          --recipe "${{ needs.preflight.outputs.recipe_id }}"
          --target "${{ inputs.target_id }}"
          --mode "${{ inputs.mode }}"
          --output .runtime-box-ci/host.json

      - name: Create an ephemeral development signing key
        run: npm run runtime-box -- keygen

      - name: Build a clean native Runtime Box
        run: >-
          npm run runtime-box:ci -- tracked-build
          --model "${{ inputs.model_id }}"
          --recipe "${{ needs.preflight.outputs.recipe_id }}"
          --target "${{ inputs.target_id }}"
          --mode "${{ inputs.mode }}"
          --channel beta
          --metrics .runtime-box-ci/build-metrics.json

      - name: Verify signature, archive hash, layout, and self-test
        run: >-
          npm run runtime-box -- verify "${{ needs.preflight.outputs.release_path }}"
          --self-test
          --receipt .runtime-box-ci/verification.json

      - name: Run the model scientific validator
        if: inputs.mode != 'build'
        run: >-
          npm run runtime-box:ci -- run-validator
          --model "${{ inputs.model_id }}"
          --recipe "${{ needs.preflight.outputs.recipe_id }}"
          --target "${{ inputs.target_id }}"
          --mode "${{ inputs.mode }}"
          --script "${{ needs.preflight.outputs.validator_script }}"
          --output .runtime-box-ci/scientific-result.json

      - name: Install pinned Rust 1.95.0
        if: inputs.mode == 'native-lifecycle'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Generate the embedded bridge bundle
        if: inputs.mode == 'native-lifecycle'
        run: npm run ts:compile --prefix src-tauri

      - name: Create placeholder frontend output
        if: inputs.mode == 'native-lifecycle'
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>runtime box lifecycle</title>' > frontend/dist/index.html

      - name: Verify the Rust Runtime Box lifecycle
        if: inputs.mode == 'native-lifecycle'
        run: >-
          node scripts/runtime-box/heartbeat.mjs
          --label "Runtime Box Rust lifecycle"
          --cwd src-tauri
          -- cargo test runtime_box -- --nocapture

      - name: Write complete model evidence
        if: always()
        run: >-
          npm run runtime-box:ci -- write-model-evidence
          --status "${{ job.status }}"
          --model "${{ inputs.model_id }}"
          --recipe "${{ needs.preflight.outputs.recipe_id }}"
          --target "${{ inputs.target_id }}"
          --mode "${{ inputs.mode }}"
          --release "${{ needs.preflight.outputs.release_path }}"
          --host .runtime-box-ci/host.json
          --metrics .runtime-box-ci/build-metrics.json
          --verification .runtime-box-ci/verification.json
          --scientific .runtime-box-ci/scientific-result.json
          --output .runtime-box-ci/model-validation.json

      - name: Upload compact model evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-box-validation-${{ inputs.model_id }}-${{ inputs.target_id }}-${{ inputs.mode }}-${{ github.run_attempt }}
          path: .runtime-box-ci/model-validation.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Clean Runtime Box build state
        if: always()
        run: npm run runtime-box:ci -- clean
