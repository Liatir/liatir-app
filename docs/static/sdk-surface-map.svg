<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
  <title id="title">Liatir SDK surface map</title>
  <desc id="desc">Diagram showing the public Liatir SDK entry point and the main namespaces exposed by it.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="1180" height="500" rx="22" fill="#f8fafc"/>
  <text x="56" y="62" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#18181b">Liatir SDK surface</text>
  <text x="56" y="92" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#71717a">Use the typed namespaces first. Use low-level invoke only for advanced cases.</text>

  <g filter="url(#shadow)">
    <rect x="420" y="130" width="340" height="96" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="462" y="169" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4338ca">import { Liatir } from "liatir"</text>
    <text x="462" y="197" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#52525b">Typed entry point plus availability helper</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="310" width="200" height="112" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="101" y="346" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#27272a">desktop</text>
    <text x="101" y="374" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">files, fs, window,</text>
    <text x="101" y="394" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">events, app, network</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="306" y="310" width="180" height="112" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="337" y="346" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#27272a">plugins</text>
    <text x="337" y="374" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">WASM modules</text>
    <text x="337" y="394" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">and calls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="522" y="310" width="180" height="112" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="553" y="346" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#27272a">pipeline</text>
    <text x="553" y="374" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">Sequential SDK</text>
    <text x="553" y="394" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">step runner</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="738" y="310" width="180" height="112" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="769" y="346" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#27272a">jobs + deps</text>
    <text x="769" y="374" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">processes and</text>
    <text x="769" y="394" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">binary checks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="954" y="310" width="160" height="112" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="985" y="346" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#27272a">qc</text>
    <text x="985" y="374" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">FastQC typed</text>
    <text x="985" y="394" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#71717a">wrapper</text>
  </g>

  <path d="M525 226 L185 304" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M558 226 L410 304" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M590 226 L612 304" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M632 226 L818 304" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 226 L1030 304" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
