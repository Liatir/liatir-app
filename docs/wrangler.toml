# Cloudflare Pages config for the Liatir docs site + waitlist function.
# The Pages project root is this `docs/` directory.

name = "liatir-docs"
compatibility_date = "2024-11-01"

# VitePress build output, relative to this file.
pages_build_output_dir = ".vitepress/dist"

# D1 binding used by functions/api/subscribe.ts (env.DB).
# Create the database first, then paste its id here:
#   npx wrangler d1 create liatir-mailing-list
[[d1_databases]]
binding = "DB"
database_name = "liatir-mailing-list"
database_id = "f742071e-fbcc-431c-bb3f-1ff5e943c52d"

# TURNSTILE_SECRET is a secret, NOT stored here. Set it with:
#   npx wrangler pages secret put TURNSTILE_SECRET
# (or in the Cloudflare dashboard → Pages → Settings → Environment variables)
