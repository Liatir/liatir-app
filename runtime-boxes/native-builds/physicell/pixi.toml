# The toolchain that builds the PhysiCell executable the physicell box ships; build.sh drives it.
# conda-forge's compilers target a glibc 2.17 sysroot, so what they build runs on every Linux the box
# supports, and pixi.lock pins every tool, so a rebuild gives the same bytes.
[workspace]
name = "physicell-native-build"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cxx-compiler = "*"
sysroot_linux-64 = "2.17.*"
make = "*"
