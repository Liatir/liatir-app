# Runtime Box pixi recipe manifest — scGPT whole-human, Linux x86_64 / CUDA 12.9.
#
# New target on the pixi substrate (Runtime Box pixi migration, Phase 5). `pixi lock` resolves this
# into the committed pixi.lock; `build` installs from that lock with --frozen and packs the prefix
# with conda-pack. See project-knowledge-base/roadmap/runtime-box-pixi-migration.md and
# runtime-box-pixi-phase0-spike.md.
#
# CUDA pin is PER-OS (Phase 0 finding): conda-forge has NO cuda 12.8 build of pytorch 2.8.0 for
# linux-64 — it resolves only to cuda129 (cuda-version >=12.9,<13). So linux-64 pins 12.9 (win-64
# pins 12.8). The `[system-requirements] cuda` plus the `cuda-version` pin make the solver pick the
# GPU build instead of the cpu_mkl one. Phase 0 proved this env imports cold and runs a real CUDA
# matmul on the RTX 4060 Ti from a relocated prefix with no activation environment. conda ships the
# CUDA runtime, so only the driver must be current; the packages declare merely `__cuda >=12`.

[workspace]
name = "scgpt-whole-human-linux-x86_64-cuda12.9"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.9"

[dependencies]
python = "3.11.*"
pytorch = "2.8.0.*"
cuda-version = "12.9.*"
anndata = "*"
numpy = "*"
scipy = "*"
pandas = "*"
h5py = "*"
tqdm = "*"
