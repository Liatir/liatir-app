# Runtime Box pixi recipe manifest — scGPT whole-human, Linux x86_64 / CPU.
#
# Pixi-substrate replacement for requirements.in/requirements.lock (Runtime Box pixi migration,
# Phase 5 rebuild). `pixi lock` resolves this into the committed pixi.lock; `build` installs from
# that lock with --frozen and packs the prefix with conda-pack. See project-knowledge-base/roadmap/
# runtime-box-pixi-migration.md and runtime-box-pixi-phase0-spike.md.
#
# Invariants: `platforms` must equal the target's conda subdir (linux-64, from targets.mjs), and
# conda-forge names the framework `pytorch` (not `torch`). The Phase 0 Linux check confirmed this
# set resolves to the `cpu_mkl` build of pytorch 2.8.0 and imports cold from a relocated prefix
# with no activation environment.

# Canonical Scrollcase v2 authoring input.
[workspace]
name = "scgpt-whole-human-linux-x86_64-cpu"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pytorch = "2.8.0.*"
anndata = "*"
numpy = "*"
scipy = "*"
pandas = "*"
h5py = "*"
tqdm = "*"
