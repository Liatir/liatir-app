# Candidate only: real CUDA scientific and product evidence is required before publication.
# Boltz's own pinned requirements are resolved into the lock, not installed during a user run.
[workspace]
name = "boltz-2-linux-x86_64-cuda12.9"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.9"

[dependencies]
python = "3.11.*"
pytorch = { version = "2.8.0.*", build = "cuda129*" }
cuda-version = "12.9.*"
numpy = ">=1.26,<2"

[pypi-dependencies]
boltz = "==2.2.1"
