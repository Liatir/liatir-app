[workspace]
name = "liatir-native-tools-linux-x86_64"
version = "1.0.0"
description = "Bioinformatics command-line tools bundled with Liatir"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.15.*"
samtools = "1.24.*"
bcftools = "1.24.*"
seqkit = "2.13.0.*"
fastp = "1.3.6.*"
bwa = "0.7.19.*"
minimap2 = "2.31.*"
simpleaf = "0.28.0.*"
alevin-fry = "0.18.0.*"
