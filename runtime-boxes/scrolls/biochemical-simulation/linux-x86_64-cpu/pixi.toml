[workspace]
name = "biochemical-simulation-linux-x86_64-cpu"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
perl = "5.44.*"
numpy = "*"
scipy = "*"
sympy = "1.11.*"
networkx = ">=3.6.1"
# PySB imports dateutil without declaring it (finding 30).
python-dateutil = "*"

[pypi-dependencies]
pysb = "==1.17.0"
