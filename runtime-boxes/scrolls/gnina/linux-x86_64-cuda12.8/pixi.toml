# GNINA's official binary links these CUDA 12 libraries dynamically; the box supplies them.
[workspace]
name = "gnina-linux-x86_64-cuda12.8"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.8"

[dependencies]
python = "3.11.*"
cuda-version = "12.8.*"
cuda-cudart = "*"
libcublas = "*"
libcufft = "*"
libcusolver = "*"
libcusparse = "*"
libcudnn = "9.*"
