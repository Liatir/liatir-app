# Separate Mini Default environment; model assets never include the v2 or ESM2 checkpoints.
[workspace]
name = "protenix-mini-default-v0-5-0-linux-x86_64-cuda12.9"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.9"

[dependencies]
python = "3.11.*"
pytorch = { version = "2.7.1.*", build = "cuda129*" }
torchvision = "0.22.1.*"
torchaudio = "2.7.1.*"
cuda-version = "12.9.*"
numpy = "2.4.1.*"

[pypi-dependencies]
protenix = { git = "https://github.com/bytedance/Protenix.git", rev = "2475421477ab414b571149ad4a875c390ff8a35d" }
